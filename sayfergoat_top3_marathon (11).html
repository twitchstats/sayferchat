<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>МАРАФОН ГТА SAN ANDREAS — SAYFERGOAT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@500;600;700&display=swap');

  :root{
    --ink:#F5F5F2;
    --muted:#8D8D96;
    --yellow:#F2C230;
    --hot:#FF3E6C;
    --panel:#141416;
    --panel2:#1C1C20;
    --line:rgba(255,255,255,0.09);
    --bg:transparent;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--bg);
    font-family:'Inter', sans-serif;
    overflow:hidden;
  }
  #wrap{
    width:380px;
    padding:14px;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- marathon timer — bare text on a transparent background ---------- */
  #timerLabel{
    font-family:'Bebas Neue', sans-serif;
    font-size:14px;
    letter-spacing:2.5px;
    color:var(--yellow);
    text-transform:uppercase;
    text-align:center;
    text-shadow:0 2px 6px rgba(0,0,0,0.85), 0 0 2px rgba(0,0,0,0.9);
    margin-bottom:6px;
  }
  #timerValue{
    font-family:'Bebas Neue', sans-serif;
    font-size:52px;
    color:var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing:2px;
    white-space:nowrap;
    text-align:center;
    text-shadow:0 3px 10px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,0.95);
  }
  #timerDays{
    font-size:24px;
    color:var(--hot);
    margin-right:8px;
    font-weight:700;
    font-variant-numeric: tabular-nums;
    text-shadow:0 3px 10px rgba(0,0,0,0.9);
  }
</style>
</head>
<body>

<div id="wrap">

  <span id="timerLabel">МАРАФОН ГТА SAN ANDREAS</span>
  <span><span id="timerDays"></span><span id="timerValue">00:00:00</span></span>

</div>

<script>
const CHANNEL = "sayfergoat";
// Тот же ключ, что использовался раньше — таймер марафона продолжается с того же момента,
// с которого уже шёл, даже после того как убрали топ чаттеров из виджета.
const STORAGE_KEY = "twitch_top3_sayfergoat_marathon";

// Таймер марафона — считается от marathonStart и НИКОГДА не сбрасывается сам:
// не по дисконнекту чата, не по офлайну стрима, не по перезапуску OBS/страницы/компьютера.
// Сбросить его может только сам стример командой !resetmarathon в чате.
let marathonStart = Date.now();

let ws = null;
let reconnectDelay = 1000;
const MAX_RECONNECT_DELAY = 15000;

const timerValueEl = document.getElementById('timerValue');
const timerDaysEl = document.getElementById('timerDays');

function loadMarathon(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved){
      const parsed = JSON.parse(saved);
      if(typeof parsed.marathonStart === 'number' && parsed.marathonStart > 0){
        marathonStart = parsed.marathonStart;
      }
    }
  }catch(e){
    console.error("Ошибка загрузки марафона", e);
  }
  saveMarathon(); // фиксируем на диске сразу же, даже если это самый первый запуск
}

function saveMarathon(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ marathonStart }));
  }catch(e){
    console.error("Ошибка сохранения марафона", e);
  }
}

function resetMarathon(){
  marathonStart = Date.now();
  saveMarathon();
}

function connect(){
  ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

  ws.onopen = () => {
    const nick = 'justinfan' + Math.floor(10000 + Math.random()*89999);
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    ws.send('PASS SCHMOOPIIE');
    ws.send('NICK ' + nick);
    ws.send('JOIN #' + CHANNEL.toLowerCase());
  };

  ws.onmessage = (event) => {
    const lines = event.data.split('\r\n').filter(Boolean);
    for(const line of lines){
      handleLine(line);
    }
  };

  ws.onclose = () => {
    scheduleReconnect();
  };

  ws.onerror = () => {
    try{ ws.close(); }catch(e){}
  };
}

function scheduleReconnect(){
  setTimeout(connect, reconnectDelay);
  reconnectDelay = Math.min(reconnectDelay * 1.6, MAX_RECONNECT_DELAY);
}

// Подключение к чату оставлено только ради одной команды — !resetmarathon от стримера.
// Сам таймер от этого соединения никак не зависит и продолжает идти даже без него.
function handleLine(line){
  if(line.startsWith('PING')){
    ws.send('PONG :tmi.twitch.tv');
    return;
  }

  if(line.includes(' 366 ') || line.includes('JOIN #')){
    reconnectDelay = 1000;
  }

  if(line.includes('PRIVMSG')){
    const msg = parsePrivmsg(line);
    if(msg && msg.text.trim() === '!resetmarathon' && msg.login === CHANNEL.toLowerCase()){
      resetMarathon();
    }
  }
}

function parsePrivmsg(line){
  const match = line.match(/:([^!]+)!\S*\sPRIVMSG\s#\S+\s:(.*)/);
  if(!match) return null;
  return { login: match[1].toLowerCase(), text: match[2] };
}

function pad(n){ return String(n).padStart(2, '0'); }

function renderTimer(){
  const elapsedSec = Math.max(0, Math.floor((Date.now() - marathonStart) / 1000));
  const days = Math.floor(elapsedSec / 86400);
  const hours = Math.floor((elapsedSec % 86400) / 3600);
  const minutes = Math.floor((elapsedSec % 3600) / 60);
  const seconds = elapsedSec % 60;

  timerDaysEl.textContent = days > 0 ? (days + 'д ') : '';
  timerValueEl.textContent = pad(hours) + ':' + pad(minutes) + ':' + pad(seconds);
}

loadMarathon();
renderTimer();
setInterval(renderTimer, 1000);
connect();
</script>
</body>
</html>
